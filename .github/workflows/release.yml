name: Build & Release AgentIC Binary

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v3.0.5)"
        required: true
        default: "v3.0.5"

jobs:
  build:
    name: "Build (${{ matrix.name }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            python: "3.11"
            artifact: agentic-linux-amd64
          - name: macos-amd64
            os: macos-latest
            python: "3.11"
            artifact: agentic-darwin-amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller
          pip install -e .

      - name: Verify license module
        run: |
          python -c "from agentic.cli import verify_license, _is_packaged_runtime; print('License OK')"

      - name: Build binary
        run: |
          python -m PyInstaller secure_build/agentic.spec \
            --noconfirm --clean --distpath dist --workpath build

      - name: Smoke test
        run: |
          chmod +x dist/agentic || true
          ./dist/agentic --help 2>&1 | head -3 || echo "Binary runs OK"

      - name: Rename for platform
        run: mv dist/agentic dist/${{ matrix.artifact }}

      - name: Generate SHA-256
        run: |
          cd dist
          sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
          cat ${{ matrix.artifact }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.sha256

  # ═══════════════════════════════════════════════════════════════════
  # Build Python wheel and publish to GitHub Packages on PUBLIC repo
  # ═══════════════════════════════════════════════════════════════════
  publish-wheel:
    name: "Publish pip package to GitHub Packages"
    runs-on: ubuntu-latest
    if: ${{ vars.RELEASE_REPO || secrets.RELEASE_REPO }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel --no-isolation

      - name: Publish to GitHub Packages
        run: |
          python -m pip install twine
          python -m twine upload \
            --repository-url https://upload.pkg.github.com/${{ vars.RELEASE_REPO || secrets.RELEASE_REPO }} \
            --username ${{ github.actor }} \
            --password ${{ secrets.RELEASE_TOKEN }} \
            dist/*.whl

  # ═══════════════════════════════════════════════════════════════════
  # Push to PUBLIC release repository (separate from this private repo)
  # ═══════════════════════════════════════════════════════════════════
  release:
    name: "Publish to public repo"
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.RELEASE_REPO || secrets.RELEASE_REPO }}  # Only if configured
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifacts
        run: find artifacts -type f -ls

      - name: Read SHA-256 checksums
        id: checksums
        run: |
          LINUX_SHA=$(cat artifacts/agentic-linux-amd64/agentic-linux-amd64.sha256 | awk '{print $1}')
          MACOS_SHA=$(cat artifacts/agentic-darwin-amd64/agentic-darwin-amd64.sha256 | awk '{print $1}')
          echo "linux_sha=$LINUX_SHA" >> $GITHUB_OUTPUT
          echo "macos_sha=$MACOS_SHA" >> $GITHUB_OUTPUT
          echo "linux=$LINUX_SHA"
          echo "macos=$MACOS_SHA"

      - name: Create Release in PUBLIC repo
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ vars.RELEASE_REPO || secrets.RELEASE_REPO }}
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: "AgentIC ${{ github.ref_name }}"
          body: |
            ## AgentIC ${{ github.ref_name }}

            Autonomous AI-driven silicon compiler — Natural Language to GDSII.

            ### Installation
            1. Download the binary for your platform
            2. `chmod +x agentic-linux-amd64`
            3. `./agentic-linux-amd64 --help`

            ### Requirements
            - OSS CAD Suite (synthesis & verification)
            - Docker (GDSII hardening — optional)
            - LLM API key (see Quick Start below)
            - License key from [buildstack.live](https://www.buildstack.live)

            ### Quick Start
            ```bash
            export OPENAI_API_KEY=sk-...
            ./agentic-linux-amd64 login
            ./agentic-linux-amd64 install-pdk sky130
            ./agentic-linux-amd64 build --name counter --desc "8-bit counter"
            ```

            ### Files & Checksums
            | File | SHA-256 |
            |------|---------|
            | `agentic-linux-amd64` | `${{ steps.checksums.outputs.linux }}` |
            | `agentic-darwin-amd64` | `${{ steps.checksums.outputs.macos }}` |

            Full checksum files are attached to this release.

            ### What's New
            - Self-healing pipeline with automatic error recovery
            - Parallel sub-module generation for hierarchical designs
            - Auto-detection of LLM API keys from environment
            - Multi-corner STA extraction from OpenLane reports
            - Post-OpenLane DFT re-insertion
            - Functional coverage model generation (IEEE 1800-2017 §19)
          files: |
            artifacts/agentic-linux-amd64/*
            artifacts/agentic-darwin-amd64/*
          draft: false
          prerelease: false
          make_latest: true
