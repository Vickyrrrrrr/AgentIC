name: Deploy Backend to Oracle Cloud

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'src/**'
      - 'ops/**'
      - 'docker-compose.yml'
      - 'Dockerfile'
      - 'requirements.txt'

jobs:
  validate:
    name: Validate Backend Before Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile and config checks
        run: |
          python -m py_compile server/api.py server/lab.py server/tasks.py src/agentic/orchestrator.py src/agentic/cli.py
          python -m json.tool ops/grafana/dashboards/agentic-overview.json > /dev/null
          docker compose config > /dev/null

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.ORACLE_HOST }} >> ~/.ssh/known_hosts

      - name: Sync files to Oracle VM via rsync
        run: |
          rsync -avz --exclude '.git' --exclude '.env' --exclude 'node_modules' --exclude '__pycache__' ./ ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }}:~/AgentIC/

      - name: Rebuild & Restart Docker Containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd ~/AgentIC
            COMPOSE_PROFILES=observability sudo docker-compose down --remove-orphans
            COMPOSE_PROFILES=observability sudo docker-compose up -d --build
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:7860/livez >/dev/null 2>&1 && curl -fsS http://127.0.0.1:7860/readyz >/dev/null 2>&1; then
                echo "AgentIC backend is healthy"
                exit 0
              fi
              echo "Waiting for AgentIC backend to become healthy..."
              sleep 5
            done
            echo "AgentIC backend failed health checks after deploy"
            exit 1
