name: Deploy Backend to Oracle Cloud

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'src/**'
      - 'ops/**'
      - 'docker-compose.yml'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'scripts/**'
      - '.github/workflows/oracle-deploy.yml'

concurrency:
  group: oracle-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Backend Before Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile and config checks
        run: |
          python -m py_compile server/db.py server/api.py server/lab.py server/tasks.py src/agentic/orchestrator.py src/agentic/cli.py
          python -m json.tool ops/grafana/dashboards/agentic-overview.json > /dev/null
          touch .env
          docker compose config > /dev/null

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.ORACLE_HOST }} >> ~/.ssh/known_hosts

      - name: Sync files to Oracle VM via rsync
        run: |
          # Enable SSH multiplexing to prevent connection issues
          mkdir -p ~/.ssh
          echo "Host *" > ~/.ssh/config
          echo "    ControlMaster auto" >> ~/.ssh/config
          echo "    ControlPath ~/.ssh/sockets/%r@%h-%p" >> ~/.ssh/config
          echo "    ControlPersist 600" >> ~/.ssh/config
          mkdir -p ~/.ssh/sockets
          
          rsync -rlptzv --delete \
            --no-owner --no-group \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude '**/node_modules/' \
            --exclude '**/__pycache__/' \
            --exclude '**/.venv*/' \
            --exclude '**/.pytest_cache/' \
            --exclude '**/.mypy_cache/' \
            --exclude '.codex' \
            --exclude 'artifacts/' \
            --exclude '**/designs/' \
            --exclude 'metrics/' \
            --exclude 'notebooks/' \
            --exclude 'agentic_jobs.db' \
            --exclude 'build.log' \
            --exclude 'agentic_npu_tapeout/' \
            ./ ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }}:~/AgentIC/

      - name: Rebuild & Restart Docker Containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          command_timeout: 60m
          script: |
            set -eu
            cd ~/AgentIC

            # ── Env file checks ──────────────────────────────────────────────
            if [ ! -f .env ]; then
              echo "Missing ~/AgentIC/.env on Oracle VM"
              exit 1
            fi

            required_keys="POSTGRES_PASSWORD REDIS_PASSWORD MINIO_ROOT_USER MINIO_ROOT_PASSWORD ALLOW_BACKEND_LLM_FALLBACK"
            for key in $required_keys; do
              if ! grep -Eq "^${key}=.+$" .env; then
                echo "Missing required env key: ${key}"
                exit 1
              fi
            done

            # Use docker compose v2 plugin - ensure plugin is available
            DOCKER_COMPOSE="docker compose"
            if ! sudo docker compose version >/dev/null 2>&1; then
              DOCKER_COMPOSE="docker-compose"
            fi
            sudo $DOCKER_COMPOSE config > /dev/null 2>&1 || true

            # ── FIX: Remove any stopped/conflicting containers before re-creating ──
            echo "Removing any conflicting stopped containers..."
            for cname in agentic_minio_setup agentic_worker agentic_api agentic_db agentic_redis agentic_minio; do
              if sudo docker ps -a --format '{{.Names}}' | grep -qx "$cname"; then
                echo "  Removing container: $cname"
                sudo docker rm -f "$cname" || true
              fi
            done

            # ── Tear down existing compose stack cleanly ──────────────────────
            sudo $DOCKER_COMPOSE down --remove-orphans || true

            # ── Cache: reuse the agentic:local image if it exists ────────────
            # Only remove dangling images (NOT the built agentic:local layer cache)
            # so the 1.5GB oss-cad-suite ARM64 layer is reused on next build.
            sudo docker image prune -f

            # ── Phase 1: Bring up CORE services only (no observability) ──────
            # This prevents prometheus from failing because api isn't ready yet
            echo "Starting core services..."
            sudo $DOCKER_COMPOSE up -d --build --force-recreate --remove-orphans \
              api worker db redis minio minio-setup

            # ── Wait for core services to be healthy ─────────────────────────
            echo "Waiting for core services to become healthy..."
            for i in $(seq 1 36); do
              api_health=$(sudo docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}unknown{{end}}' agentic_api 2>/dev/null || echo unknown)
              worker_health=$(sudo docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}unknown{{end}}' agentic_worker 2>/dev/null || echo unknown)
              if [ "$api_health" = "healthy" ] && [ "$worker_health" = "healthy" ] && \
                 curl -fsS http://127.0.0.1:7860/livez >/dev/null 2>&1; then
                echo "Core services are healthy (api=${api_health} worker=${worker_health})"
                break
              fi
              echo "  [${i}/36] api=${api_health} worker=${worker_health} — retrying in 5s..."
              sleep 5
            done

            # ── Phase 2: Bring up observability stack AFTER core is healthy ──
            # Prometheus depends_on api healthy — now it will succeed
            echo "Starting observability stack (prometheus + grafana)..."
            sudo env COMPOSE_PROFILES=observability \
              $DOCKER_COMPOSE up -d --remove-orphans prometheus grafana || \
              echo "WARNING: Observability stack failed to start — core services are still running"

            # ── Final health check ────────────────────────────────────────────
            for i in $(seq 1 12); do
              api_health=$(sudo docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}unknown{{end}}' agentic_api 2>/dev/null || echo unknown)
              worker_health=$(sudo docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}unknown{{end}}' agentic_worker 2>/dev/null || echo unknown)
              if [ "$api_health" = "healthy" ] && [ "$worker_health" = "healthy" ] && \
                 curl -fsS http://127.0.0.1:7860/livez >/dev/null 2>&1 && \
                 curl -fsS http://127.0.0.1:7860/readyz >/dev/null 2>&1; then
                echo "AgentIC backend is fully healthy — deploy complete!"
                sudo $DOCKER_COMPOSE ps
                exit 0
              fi
              echo "Waiting for final health check... api=${api_health} worker=${worker_health}"
              sleep 5
            done

            echo "AgentIC backend failed health checks after deploy"
            sudo $DOCKER_COMPOSE ps
            sudo $DOCKER_COMPOSE logs --tail=100 api worker
            exit 1
