services:
  # The FastAPI Web Server (handles API requests quickly)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentic:local
    container_name: agentic_api
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://agentic_user:${POSTGRES_PASSWORD:-password}@db:5432/agentic_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-agentic-redis-dev-password}@redis:6379/0
      - RUN_CELERY=true
      - CELERY_TASK_SOFT_TIME_LIMIT=7200
      - CELERY_TASK_TIME_LIMIT=7300
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - S3_BUCKET_NAME=agentic-artifacts
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./artifacts:/app/artifacts
      - ./training:/app/training
      - ./designs:/app/designs
      - ./server:/app/server
      - ./src:/app/src
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/volare:/home/appuser/.volare
    group_add:
      - "${DOCKER_GID:-1001}"
    entrypoint: ["/bin/sh", "/app/scripts/init-dirs.sh"]
    command: gunicorn server.api:app -w 1 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:7860
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7860/livez >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Give gunicorn + DB init enough time before first check fires
      start_period: 60s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # The Background Worker (handles heavy LLM & VLSI builds)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentic:local
    container_name: agentic_worker
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://agentic_user:${POSTGRES_PASSWORD:-password}@db:5432/agentic_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-agentic-redis-dev-password}@redis:6379/0
      - RUN_CELERY=true
      - CELERY_TASK_SOFT_TIME_LIMIT=7200
      - CELERY_TASK_TIME_LIMIT=7300
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - S3_BUCKET_NAME=agentic-artifacts
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./artifacts:/app/artifacts
      - ./training:/app/training
      - ./designs:/app/designs
      - ./server:/app/server
      - ./src:/app/src
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/volare:/home/appuser/.volare
    group_add:
      - "${DOCKER_GID:-1001}"
    entrypoint: ["/bin/sh", "/app/scripts/init-dirs.sh"]
    command: celery -A server.tasks worker --loglevel=info
    healthcheck:
      # Use python directly (celery inspect ping can be flaky on startup)
      test: ["CMD-SHELL", "python -c 'import server.tasks; print(\"ok\")' 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      # Give celery time to connect to Redis + DB before first check
      start_period: 60s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Redis (Message Broker for Celery Queue)
  redis:
    image: redis:7.4-alpine
    container_name: agentic_redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-agentic-redis-dev-password}
    command: redis-server --appendonly yes --save 60 1000 --requirepass ${REDIS_PASSWORD:-agentic-redis-dev-password}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # PostgreSQL (Persistent Database for Job Tracking/Status)
  db:
    image: postgres:15-alpine
    container_name: agentic_db
    environment:
      - POSTGRES_USER=agentic_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=agentic_db
    volumes:
      - agentic_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic_user -d agentic_db"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # MinIO (Self-hosted S3 Object Storage)
  minio:
    image: minio/minio
    container_name: agentic_minio
    ports:
      - "127.0.0.1:9500:9000"
      - "127.0.0.1:9501:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - agentic_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Setup container to automatically create the agentic-artifacts bucket
  minio-setup:
    image: minio/mc
    container_name: agentic_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      until /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} > /dev/null 2>&1; do
        echo 'waiting for minio...';
        sleep 2;
      done;
      /usr/bin/mc mb myminio/agentic-artifacts --ignore-existing;
      /usr/bin/mc anonymous set public myminio/agentic-artifacts;
      exit 0;
      "

  prometheus:
    image: prom/prometheus:latest
    container_name: agentic_prometheus
    profiles: ["observability"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  grafana:
    image: grafana/grafana-oss:latest
    container_name: agentic_grafana
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  agentic_db_data:
  agentic_minio_data:
  redis_data:
  prometheus_data:
  grafana_data:
