services:
  # The FastAPI Web Server (handles API requests quickly)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentic:local
    container_name: agentic_api
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      # Pass database and redis URIs to connect
      - DATABASE_URL=postgresql://agentic_user:password@db:5432/agentic_db
      - REDIS_URL=redis://redis:6379/0
      # MinIO (S3 Compatible) Storage
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET_NAME=agentic-artifacts
    depends_on:
      - redis
      - db
      - minio
    volumes:
      - ./artifacts:/app/artifacts
      - ./training:/app/training
      - ./designs:/app/designs
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/volare:/root/.volare
    restart: unless-stopped

  # The Background Worker (handles heavy LLM & VLSI builds)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentic:local
    container_name: agentic_worker
    command: celery -A server.tasks worker --loglevel=info
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://agentic_user:password@db:5432/agentic_db
      - REDIS_URL=redis://redis:6379/0
      # MinIO (S3 Compatible) Storage
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET_NAME=agentic-artifacts
    depends_on:
      - redis
      - db
      - minio
    volumes:
      - ./artifacts:/app/artifacts
      - ./training:/app/training
      - ./designs:/app/designs
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/volare:/root/.volare
    restart: unless-stopped

  # Redis (Message Broker for Celery Queue)
  redis:
    image: redis:alpine
    container_name: agentic_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # PostgreSQL (Persistent Database for Job Tracking/Status)
  db:
    image: postgres:15-alpine
    container_name: agentic_db
    environment:
      - POSTGRES_USER=agentic_user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=agentic_db
    ports:
      - "5432:5432"
    volumes:
      - agentic_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  # MinIO (Self-hosted S3 Object Storage)
  minio:
    image: minio/minio
    container_name: agentic_minio
    ports:
      - "9000:9000" # API Port
      - "9001:9001" # Web Console Port
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - agentic_minio_data:/data
    restart: unless-stopped

  # Setup container to automatically create the agentic-artifacts bucket
  minio-setup:
    image: minio/mc
    container_name: agentic_minio_setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin > /dev/null 2>&1; do
        echo 'waiting for minio...';
        sleep 2;
      done;
      /usr/bin/mc mb myminio/agentic-artifacts --ignore-existing;
      /usr/bin/mc anonymous set public myminio/agentic-artifacts;
      exit 0;
      "

volumes:
  agentic_db_data:
  agentic_minio_data:
