services:
  agentic:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentic:local
    container_name: agentic_local
    ports:
      - "7860:7860"
    env_file:
      - .env
    volumes:
      - ./artifacts:/app/artifacts
      - ./training:/app/training
      - ./designs:/app/designs
      - /var/run/docker.sock:/var/run/docker.sock  # Allows AgentIC to trigger OpenLane's Docker container
      - ~/volare:/root/.volare  # Mount PDK path so Sky130 is cached
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
