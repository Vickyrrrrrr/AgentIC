[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-ic"
version = "3.0.2"
description = "AgentIC — Autonomous AI-Driven Chip Design: Natural Language to GDSII"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.10"
authors = [
    {name = "AgentIC Team", email = "vickynishad110@gmail.com"},
]
keywords = ["chip-design", "vlsi", "eda", "ai", "llm", "gdsii", "verilog", "silicon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "crewai>=1.9.0",
    "crewai-tools",
    "langchain_openai",
    "litellm>=1.0.0",
    "openai>=1.0.0",
    "pydantic",
    "pyverilog",
    "typer",
    "rich",
    "python-dotenv",
    "httpx",
    "requests",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "boto3>=1.35.0",
    "prometheus-client>=0.20.0",
]
reports = [
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]
all = ["agentic-ic[server,reports,dev]"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[project.scripts]
agentic = "agentic.cli:app"

[project.urls]
Homepage = "https://www.buildstack.live"
Repository = "https://github.com/Vickyrrrrrr/AgentIC"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic"]
packages-dirs = ["src"]

[tool.hatch.build.targets.sdist]
exclude = [
    "src/agentic/designs/",
    "secure_build/",
    "agentic_npu_tapeout/",
    "scripts/",
    "docs/",
    "tests/",
    "test/",
]
