[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-ic"
version = "1.0.0"
description = "AgentIC — Autonomous AI agents for open-source VLSI chip design"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.10"
authors = [
    {name = "AgentIC Team", email = "vickynishad110@gmail.com"},
]
keywords = ["chip-design", "vlsi", "eda", "ai", "llm", "gdsii", "verilog", "silicon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "crewai>=1.9.0",
    "crewai-tools",
    "langchain_openai",
    "litellm>=1.0.0",
    "email-validator>=2.0.0",
    "openai>=1.0.0",
    "pydantic",
    "pyverilog",
    "typer",
    "rich",
    "python-dotenv",
    "httpx",
    "requests",
    "cryptography>=41.0.0",
]

[project.scripts]
agentic = "agentic.cli:app"

[project.urls]
Homepage = "https://www.buildstack.live"
Repository = "https://github.com/Vickyrrrrrr/AgentIC"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic"]
packages-dirs = ["src"]

[tool.hatch.build.targets.sdist]
exclude = [
    "designs/",
    "scripts/",
    "docs/",
    "tests/",
    ".agents/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    ".git",
    "knowledge",
    ".agentic_cache",
    ".agents",
    "build",
    "dist",
    "qdrant_storage",
    "sandbox",
    "scripts",
    "web",
    "node_modules",
]
python_files = ["test_*.py"]
addopts = "--ignore=knowledge"
